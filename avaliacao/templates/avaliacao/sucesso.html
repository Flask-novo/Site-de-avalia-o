<!-- avaliacao/templates/avaliacao/sucesso.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sucesso!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fffafb;
            background-image: radial-gradient(#ffcdd2 1px, transparent 1px);
            background-size: 20px 20px;
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .success-card {
            background: white;
            border-radius: 15px;
            padding: 50px;
            box-shadow: 0 10px 30px rgba(183, 28, 28, 0.1);
            border-top: 6px solid #d32f2f;
        }
        .icon-check {
            font-size: 80px;
            color: #d32f2f;
            margin-bottom: 20px;
        }
        .btn-voltar {
            background-color: white;
            border: 2px solid #d32f2f;
            color: #d32f2f;
            font-weight: 500;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-voltar:hover {
            background-color: #d32f2f;
            color: white;
        }
    </style>
</head>
<body>

<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 success-card">
            <div class="icon-check">❤️</div> <!-- Coração em referência ao cuidado/saúde -->
            <h1 class="fw-bold mb-3" style="color: #b71c1c;">Muito Obrigado!</h1>
            <p class="text-muted mb-4 fs-5">Sua avaliação foi enviada e recebida com sucesso. Agradecemos por contribuir com nosso projeto de conscientização!</p>
            <a href="{% url 'formulario' %}" class="btn btn-voltar px-4 py-2">Voltar ao início</a>
        </div>
    </div>
</div>

</body>
</html>
